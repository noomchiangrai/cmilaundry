function f(id,v){var l=String(v.length);return id+(l.length<2?'0'+l:l)+v}
function crc(s){var c=0xFFFF;for(var i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(var j=0;j<8;j++)c=(c&0x8000)?((c<<1)^0x1021)&0xFFFF:(c<<1)&0xFFFF}return c.toString(16).toUpperCase().padStart(4,'0')}
function ppPayload(id,amt){id=id.replace(/\D/g,'');var acc=id.length>=13?f('02',id):f('01','0066'+id.replace(/^0/,''));
  var p=f('00','01')+f('01',amt?'12':'11')+f('29',f('00','A000000677010111')+acc)+f('53','764')+(amt?f('54',amt.toFixed(2)):'')+f('58','TH');p+='6304';return p+crc(p)}

  var h='<div class="card"><h2>บันทึกใบรับผ้า</h2><div class="row"><label>โรงแรม<select onchange="ecust=this.value;eq={};render()">'+S.custs.map(function(x){return '<option value="'+x.id+'"'+(x.id===ecust?' selected':'')+'>'+esc(x.name)+'</option>'}).join('')+'</select></label>'+
  '<label>วันที่รับผ้า<input type="date" value="'+edate+'" onchange="edate=this.value;render()"></label></div><div class="items">'+
  S.items.filter(function(it){return c.prices[it.id]!==undefined}).map(function(it){var p=c.prices[it.id]||0;return '<label>'+esc(it.name)+'<input type="number" min="0" inputmode="numeric" value="'+(eq[it.id]||'')+'" oninput="eq[\''+it.id+'\']=+this.value;updSub()"><small>'+money(p)+' บาท/ชิ้น</small></label>'}).join('')+
  '</div><div class="row" style="margin-top:14px"><div>รวมใบนี้<div class="sub" id="sub">0.00</div></div><button class="b" onclick="saveNote()">บันทึกใบรับผ้า</button></div></div>';
  var ns=S.notes.filter(function(n){return n.date===edate}).reverse();
  h+='<div class="card"><h2>ใบรับผ้าวันที่ '+dth(edate)+'</h2>'+(ns.length?'<div class="wrap"><table><tr><th>เลขที่</th><th>โรงแรม</th><th class="n">ชิ้น</th><th class="n">ยอด (บาท)</th><th></th></tr>'+ns.map(function(n){var s=nSum(n);return '<tr><td>'+n.no+'</td><td>'+esc(cust(n.cid).name)+'</td><td class="n">'+s.qty+'</td><td class="n">'+money(s.amt)+'</td><td><button class="x" onclick="delNote(\''+n.id+'\')">ลบ</button></td></tr>'}).join('')+'</table></div>':'<div class="empty">ยังไม่มีใบรับผ้าในวันนี้ กรอกจำนวนด้านบนแล้วกดบันทึก</div>')+'</div>';
  return h}
function updSub(){var c=cust(ecust),t=0;for(var k in eq)t+=(eq[k]||0)*(c.prices[k]||0);var e=$('#sub');if(e)e.textContent=money(t)}
function saveNote(){var c=cust(ecust),L={},any=false;for(var k in eq)if(eq[k]>0){L[k]={q:eq[k],p:c.prices[k]||0};any=true}
  if(!any){alert('กรอกจำนวนผ้าอย่างน้อย 1 รายการ');return}
  var cnt=S.notes.filter(function(n){return n.date===edate}).length+1;
  S.notes.push({id:'n'+Date.now(),no:'R'+edate.replace(/-/g,'')+'-'+cnt,date:edate,cid:ecust,lines:L});eq={};save();render()}
function delNote(id){if(confirm('ลบใบรับผ้านี้?')){S.notes=S.notes.filter(function(n){return n.id!==id});save();render()}}

function vDaily(){
  var ns=S.notes.filter(function(n){return n.date===day});
  var h='<div class="card"><h2>สรุปยอดซักผ้ารายวัน</h2><div class="row"><label>วันที่<input type="date" value="'+day+'" onchange="day=this.value;render()"></label></div>';
  if(!ns.length)return h+'<div class="empty">ไม่มีงานซักในวันที่เลือก</div></div>';
  var tot={},ta=0,tq=0,tn=0;
  var rows=S.custs.map(function(c){var m=ns.filter(function(n){return n.cid===c.id});if(!m.length)return '';var a=0,q=0;
    m.forEach(function(n){for(var k in n.lines){tot[k]=(tot[k]||0)+n.lines[k].q}var s=nSum(n);a+=s.amt;q+=s.qty});ta+=a;tq+=q;tn+=m.length;
    return '<tr><td>'+esc(c.name)+'</td><td class="n">'+m.length+'</td><td class="n">'+q+'</td><td class="n">'+money(a)+'</td></tr>'}).join('');
  h+='<div class="wrap"><table><tr><th>โรงแรม</th><th class="n">ใบรับผ้า</th><th class="n">ชิ้น</th><th class="n">ยอด (บาท)</th></tr>'+rows+'<tfoot><tr><td>รวมทั้งวัน</td><td class="n">'+tn+'</td><td class="n">'+tq+'</td><td class="n">'+money(ta)+'</td></tr></tfoot></table></div></div>';
  h+='<div class="card"><h2>ผ้าที่ซักทั้งวัน แยกตามประเภท</h2><div class="wrap"><table><tr><th>ประเภทผ้า</th><th class="n">จำนวน (ชิ้น)</th></tr>'+S.items.filter(function(i){return tot[i.id]}).map(function(i){return '<tr><td>'+esc(i.name)+'</td><td class="n">'+tot[i.id]+'</td></tr>'}).join('')+'</table></div></div>';
  return h}
function vMonthly(){
  var rows=S.custs.map(function(c){return{c:c,a:monthAgg(c.id,month)}}),T=rows.reduce(function(s,r){s.amt+=r.a.amt;s.net+=r.a.net;s.qty+=r.a.qty;return s},{amt:0,net:0,qty:0});
  var unpaid=0;rows.forEach(function(r){if(r.a.amt&&!S.paid[r.c.id+'|'+month])unpaid+=r.a.net});
  var h='<div class="card"><h2>สรุปยอดรายเดือนแต่ละโรงแรม</h2><div class="row"><label>เดือน<input type="month" value="'+month+'" onchange="month=this.value;render()"></label></div>'+
  '<div class="kpi"><div><b>'+money(T.amt)+'</b><span>ยอดซักรวม (บาท)</span></div><div><b>'+T.qty.toLocaleString('th-TH')+'</b><span>ผ้าทั้งหมด (ชิ้น)</span></div><div><b>'+money(unpaid)+'</b><span>ค้างชำระ หลังหัก ณ ที่จ่าย</span></div></div>'+
  '<div class="wrap"><table><tr><th>โรงแรม</th><th class="n">วันที่ส่งผ้า</th><th class="n">ชิ้น</th><th class="n">ยอดรวม</th><th class="n">หัก 3%</th><th class="n">ยอดชำระ</th><th>สถานะ</th><th></th></tr>'+
  rows.map(function(r){var p=S.paid[r.c.id+'|'+month],a=r.a;if(!a.ns.length)return '';return '<tr><td>'+esc(r.c.name)+(r.c.tax?' <span class="tag">ใบกำกับภาษี</span>':'')+'</td><td class="n">'+a.days+'</td><td class="n">'+a.qty+'</td><td class="n">'+money(a.amt)+'</td><td class="n">'+(a.wht?'-'+money(a.wht):'-')+'</td><td class="n"><b>'+money(a.net)+'</b></td><td>'+(p?'<span class="tag ok">ชำระแล้ว</span>':'<span class="tag w">ค้างชำระ</span>')+'</td><td><button class="b g" onclick="openBill(\''+r.c.id+'\')">ใบวางบิล + QR</button></td></tr>'}).join('')+
  '<tfoot><tr><td>รวมทุกโรงแรม</td><td></td><td class="n">'+T.qty+'</td><td class="n">'+money(T.amt)+'</td><td></td><td class="n">'+money(T.net)+'</td><td></td><td></td></tr></tfoot></table></div></div>';
  return h}

function openBill(cid){
  var c=cust(cid),a=monthAgg(cid,month),paid=S.paid[cid+'|'+month],used=S.items.filter(function(it){return a.ns.some(function(n){return n.lines[it.id]})});
  var sm={};a.ns.forEach(function(n){for(var k in n.lines){var s=sm[k]||(sm[k]={q:0,a:0});s.q+=n.lines[k].q;s.a+=n.lines[k].q*n.lines[k].p}});
  var ac=S.accts.filter(function(x){return x.id===S.acc})[0]||S.accts[0],sel=S.accts.map(function(x){return '<label style="flex-direction:row;display:inline-flex;align-items:center;gap:6px;margin-right:16px;color:#14293b"><input type="radio" name="acc" '+(x.id===ac.id?'checked':'')+' onchange="S.acc=\''+x.id+'\';save();openBill(\''+cid+'\')"> '+esc(x.name)+' ('+esc(x.pp)+')</label>'}).join('');
  var h='<div class="noprint row"><button class="b" onclick="window.print()">พิมพ์ / บันทึก PDF</button><button class="b ok" onclick="togglePaid(\''+cid+'\')">'+(paid?'ยกเลิกสถานะชำระแล้ว':'ทำเครื่องหมายว่าชำระแล้ว')+'</button><button class="b g" onclick="closeBill()">ปิด</button></div>'+
  '<div class="noprint" style="margin:0 0 14px;padding:10px 12px;background:#e4f1f4;border-radius:8px"><b>โอนเข้าบัญชี:</b><br>'+sel+'</div><h3>ใบวางบิล / สรุปยอดประจำเดือน</h3><div>'+esc(S.shop)+'</div><hr style="border:0;border-top:1px solid #d9e3ea;margin:12px 0"><div><b>'+esc(c.name)+'</b></div><div>ประจำเดือน '+mth(month)+'</div>'+
  '<div class="wrap" style="margin-top:12px"><table><tr><th>รายการผ้า</th><th class="n">จำนวน (ชิ้น)</th><th class="n">ยอด (บาท)</th></tr>'+used.map(function(it){return '<tr><td>'+esc(it.name)+'</td><td class="n">'+sm[it.id].q+'</td><td class="n">'+money(sm[it.id].a)+'</td></tr>'}).join('')+
  '<tfoot><tr><td>รวมค่าบริการ</td><td class="n">'+a.qty+'</td><td class="n">'+money(a.amt)+'</td></tr></tfoot></table></div>'+
  (a.wht?'<div style="text-align:right;margin-top:8px">หัก ณ ที่จ่าย 3%: -'+money(a.wht)+'</div>':'')+
  '<div style="text-align:right;font-size:1.3rem;font-weight:700;margin-top:4px">ยอดชำระสุทธิ '+money(a.net)+' บาท</div>'+
  '<div class="qrbox"><div id="qr"></div><div>'+(paid?'<b style="color:#1a7f4b">ชำระเงินแล้ว</b>':'<b>สแกนจ่ายผ่านพร้อมเพย์</b><br>ยอด '+money(a.net)+' บาท<br><small>พร้อมเพย์ '+esc(ac.name)+': '+esc(ac.pp)+'</small>')+'</div></div>'+
  '<h4 style="margin:18px 0 6px">รายละเอียดใบรับผ้า ('+a.ns.length+' ใบ)</h4><div class="wrap"><table><tr><th>วันที่</th><th>เลขที่ใบรับผ้า</th><th class="n">ชิ้น</th><th class="n">ยอด</th></tr>'+a.ns.map(function(n){var s=nSum(n);return '<tr><td>'+dth(n.date)+'</td><td>'+n.no+'</td><td class="n">'+s.qty+'</td><td class="n">'+money(s.amt)+'</td></tr>'}).join('')+'</table></div>'+
  (c.tax?'<p style="font-size:.85rem;color:#5d7283">โรงแรมนี้ต้องการใบกำกับภาษี ออกจากโปรแกรมบัญชีเดิม</p>':'');
  $('#sheet').innerHTML=h;$('#modal').classList.add('on');
  if(!paid&&window.QRCode&&a.net>0){new QRCode($('#qr'),{text:ppPayload(ac.pp,a.net),width:170,height:170,correctLevel:QRCode.CorrectLevel.M})}
  else if(!paid)$('#qr').textContent='ไม่สามารถสร้าง QR ได้'}
function closeBill(){$('#modal').classList.remove('on')}
function togglePaid(cid){var k=cid+'|'+month;if(S.paid[k])delete S.paid[k];else S.paid[k]=true;save();closeBill();render()}

function vCust(){
  var h='<div class="card"><h2>ตั้งค่าร้าน</h2><div class="row"><label>ชื่อร้าน<input value="'+esc(S.shop)+'" onchange="S.shop=this.value;save()"></label>'+S.accts.map(function(x,i){return '<label>พร้อมเพย์ '+esc(x.name)+' (เบอร์มือถือหรือเลขบัตร 13 หลัก)<input value="'+esc(x.pp)+'" inputmode="numeric" onchange="S.accts['+i+'].pp=this.value;save()"></label>'}).join('')+'</div></div>';
  h+='<div class="card"><h2>ลูกค้าและราคาต่อชิ้น</h2>'+S.custs.map(function(c){
    return '<details class="cust"><summary>'+esc(c.name)+'</summary><div class="row" style="margin-top:10px"><label>ชื่อโรงแรม<input value="'+esc(c.name)+'" onchange="cust(\''+c.id+'\').name=this.value;save()"></label>'+
    '<label style="flex-direction:row;align-items:center"><input type="checkbox" '+(c.tax?'checked':'')+' onchange="cust(\''+c.id+'\').tax=this.checked;save()"> ต้องการใบกำกับภาษี</label>'+
    '<label style="flex-direction:row;align-items:center"><input type="checkbox" '+(c.wht?'checked':'')+' onchange="cust(\''+c.id+'\').wht=this.checked;save()"> หัก ณ ที่จ่าย 3%</label></div><div class="items">'+
    S.items.filter(function(it){return c.prices[it.id]!==undefined}).map(function(it){return '<label>'+esc(it.name)+' (บาท)<input type="number" min="0" step="0.5" value="'+(c.prices[it.id]||0)+'" onchange="cust(\''+c.id+'\').prices[\''+it.id+'\']=+this.value;save()"></label>'}).join('')+'</div><button class="b g" style="margin-top:10px" onclick="addCItem(\''+c.id+'\')">+ เพิ่มรายการผ้าให้โรงแรมนี้</button></details>'}).join('')+
  '<div class="row"><button class="b" onclick="addCust()">+ เพิ่มโรงแรม</button><button class="b g" onclick="resetAll()">รีเซ็ตข้อมูลตัวอย่าง</button></div><small style="color:var(--mut)">ราคาที่แก้ไขมีผลกับใบรับผ้าใหม่เท่านั้น ใบเก่าคงราคาเดิม</small></div>';
  return h}
function addCust(){var n=prompt('ชื่อโรงแรม');if(!n)return;var p={};S.items.forEach(function(i){p[i.id]=0});S.custs.push({id:'c'+Date.now(),name:n,tax:false,wht:false,prices:p});save();render()}
function addCItem(cid){var n=prompt('ชื่อรายการผ้า');if(!n)return;var p=prompt('ราคาต่อชิ้น (บาท)');if(p===null)return;var it=S.items.filter(function(i){return i.name===n.trim()})[0];if(!it){it={id:'i'+Date.now(),name:n.trim()};S.items.push(it)}cust(cid).prices[it.id]=+p||0;save();render()}
function addItem_unused(){var n=prompt('ชื่อประเภทผ้า');if(!n)return;S.items.push({id:'i'+Date.now(),name:n});save();render()}
function resetAll(){if(confirm('ล้างข้อมูลทั้งหมดและกลับเป็นข้อมูลตัวอย่าง?')){S=seed();save();ecust='';eq={};render()}}

S=load();render();
</script>
</body>
</html>
